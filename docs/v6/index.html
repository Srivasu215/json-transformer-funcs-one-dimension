<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco Editor — 1D Collection 50/50 Dual-Pane Studio (v6)</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <!-- Top Bar -->
    <div class="tab-bar">
        <div class="editor-tabs" id="editorTabs">
            <button class="tab-item active" id="tabBase" type="button" title="View Base JSON">
                <i class="bi bi-columns text-info"></i>
                <span>base.json</span>
            </button>
            <button class="tab-item" id="tabColumns" type="button" title="View Columns JSON">
                <i class="bi bi-columns text-info"></i>
                <span>columns.json</span>
            </button>

            <button class="tab-item" id="tabTemplate" type="button" title="View Template JSON">
                <i class="bi bi-filetype-json text-warning"></i>
                <span>template.json</span>
            </button>
        </div>

        <div class="tab-actions">
            <button class="action-btn" id="baseBtn" type="button" title="Load Base JSON">
                <i class="bi bi-columns"></i>
                <span>base</span>
            </button>
            <button class="action-btn" id="rakaBtn" type="button" title="Load Raka Columns JSON">
                <i class="bi bi-columns"></i>
                <span>raka</span>
            </button>
            <button class="action-btn" id="templateBtn" type="button" title="Load Template JSON">
                <i class="bi bi-filetype-json"></i>
                <span>template</span>
            </button>

            <div class="d-flex align-items-center gap-2">
                <label for="targetSelect"
                    class="text-secondary small fw-semibold text-nowrap d-flex align-items-center gap-1 mb-0"
                    style="font-size: 11px;">
                    <i class="bi bi-bullseye text-warning"></i>
                    <span>Target:</span>
                </label>
                <select id="targetSelect" class="form-select form-select-sm text-light border-secondary"
                    style="background-color: #2d2d2d; font-size: 12px; height: 28px; padding-top: 2px; padding-bottom: 2px; min-width: 170px;">
                    <option value="renderOutput" selected>#renderOutput (Root Stage)</option>
                </select>
            </div>
            <button class="action-btn" id="renderBtn" type="button" title="Build & Render into Right Stage">
                <i class="bi bi-play-fill"></i>
                <span>render</span>
            </button>
        </div>
    </div>

    <!-- 50 / 50 Split Workspace Container -->
    <main class="workspace-container">
        <!-- Left 50%: Monaco Editor -->
        <div id="jsonEditor" class="editor-pane"></div>

        <!-- Right 50%: Live DOM Rendering Stage -->
        <div class="preview-pane">
            <div class="preview-header">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-display text-primary"></i>
                    <span class="fw-semibold text-dark small">Live Render Stage</span>
                </div>
                <span class="badge bg-success-subtle text-success border border-success-subtle small">1D Interactive
                    DOM</span>
            </div>
            <div class="preview-body">
                <div id="renderOutput" class="stage-card">
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-arrow-left-circle fs-2 text-primary d-block mb-2"></i>
                        <p class="mb-0 fw-medium">Click <strong>build</strong> above to compile the 1D collection into
                            HTML.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Hidden Native OS File Picker Input -->
    <input type="file" id="fileInput" accept=".json,.js,application/json,text/javascript" style="display: none;">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script src="https://keshavsoft.github.io/dom-primitive-bindings/dist/v5/min.js" type="module"></script>
    <script src="https://keshavsoft.github.io/json-transformer-funcs-one-dimension/dist/v9/min.js"
        type="module"></script>
    <script src="https://keshavsoft.github.io/json-to-dom/dist/v42/min.js" type="module"></script>

    <script type="module" src="./js/index.js"></script>
</body>

</html>
